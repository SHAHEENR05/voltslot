# Profile "test": runs without MySQL. H2 in-memory in MySQL compatibility mode, schema generated from the entities.
spring.datasource.url=jdbc:h2:mem:chargeiq_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
app.jwt.expiry-hours=12

# deterministic time: the clock starts at the anchor and the schedulers stay quiet
app.clock.mode=FIXED
app.clock.anchor=2026-10-03T09:30:00
app.demo-mode=true
app.scheduler.enabled=false
