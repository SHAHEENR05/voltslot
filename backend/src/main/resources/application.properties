# =====================================================================
#  VoltSlot - main configuration. Every value can be overridden with an
#  environment variable (12-factor style), e.g.  DB_PASSWORD=secret ./mvnw spring-boot:run
# =====================================================================
spring.application.name=chargeiq
server.port=${PORT:8080}

# ---------- Database (MySQL 8, schema created by db/01_schema.sql) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chargeiq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
# small pool: a student laptop / free-tier host does not need more
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:6}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ---------- JPA / Hibernate ----------
# The schema is owned by db/01_schema.sql, Hibernate must never change it.
# Set to "validate" once to verify that the entities match the tables.
spring.jpa.hibernate.ddl-auto=none
# false => no lazy loading outside a transaction; services map entities to DTOs inside @Transactional
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ---------- Security ----------
# Dev default only. Always override JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:chargeiq-dev-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-TCET-IT-2026}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ---------- Demo clock ("time machine") ----------
# FIXED  = starts at the anchor (the day the synthetic data ends) and ticks in real time; SYSTEM = real time.
app.clock.mode=${CLOCK_MODE:FIXED}
app.clock.anchor=${CLOCK_ANCHOR:2026-10-03T09:30:00}
app.demo-mode=${DEMO_MODE:true}

# ---------- Background jobs (@Scheduled, driven by the app clock) ----------
app.scheduler.enabled=${SCHEDULER_ENABLED:true}
app.scheduler.bookings-ms=${SCHEDULER_BOOKINGS_MS:30000}
app.scheduler.reminders-ms=${SCHEDULER_REMINDERS_MS:300000}

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# ---------- Error responses ----------
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.chargeiq=INFO
